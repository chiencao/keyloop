<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Book — Vehicle Service</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E4A44'/%3E%3Cpath d='M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.3-.6-.6-2.3z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
  *,*::before,*::after{ box-sizing:border-box; }
  :root{
    --bg:#EDF0F3; --surface:#FFFFFF; --raise:#F7F9FB;
    --ink:#141C26; --body:#3B4653; --muted:#727D8A; --faint:#9AA4AF;
    --line:#E3E7EC; --line-2:#EEF1F4;
    --brand:#0E4A44; --brand-2:#0A3833;
    --accent:#EE7A1E; --accent-d:#CD640F; --accent-wash:#FDF0E2; --accent-line:#F3CFA6;
    --avail:#1E8A4F; --avail-wash:#E7F3EC;
    --full:#BC4A3A; --gold:#E0A100;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --shadow:0 1px 2px rgba(20,28,38,.04),0 14px 40px -28px rgba(20,28,38,.5);
  }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--body); font-family:var(--sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

  .topbar{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,.86); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .topbar .in{ max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:14px clamp(16px,4vw,32px); }
  .logo{ display:flex; align-items:center; gap:10px; font-weight:750; color:var(--ink); letter-spacing:-.01em; }
  .logo .mark{ width:30px; height:30px; border-radius:8px; background:var(--brand); display:grid; place-items:center; color:#fff; }
  .logo small{ display:block; font-family:var(--mono); font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .acct{ margin-left:auto; display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); padding:5px 10px 5px 12px; border-radius:999px; color:var(--brand); }
  .acct select{ width:auto; border:0; background:none; font-family:var(--sans); font-weight:650; font-size:.86rem; color:var(--ink); padding:2px 2px; cursor:pointer; }
  .acct select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .home{ display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--muted); background:var(--raise); border:1px solid var(--line); padding:7px 12px; border-radius:999px; }
  .home .mono{ color:var(--ink); }
  @media(max-width:560px){ .home{ display:none; } }

  .lane{ max-width:1080px; margin:0 auto; padding:20px clamp(16px,4vw,32px) 4px; }
  .lane ol{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,1fr); gap:0; }
  .lane li{ position:relative; display:flex; flex-direction:column; align-items:center; gap:7px; padding-top:6px; cursor:default; }
  .lane li .n{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:.82rem; font-weight:600; background:var(--surface); border:1.5px solid var(--line); color:var(--faint); z-index:2; transition:all .25s; }
  .lane li .t{ font-size:.72rem; font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .lane li::before,.lane li::after{ content:""; position:absolute; top:20px; height:2px; background:var(--line); z-index:1; }
  .lane li::before{ left:0; right:50%; } .lane li::after{ left:50%; right:0; }
  .lane li:first-child::before,.lane li:last-child::after{ display:none; }
  .lane li.done .n{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .lane li.active .n{ background:var(--surface); border-color:var(--accent); color:var(--accent-d); box-shadow:0 0 0 4px var(--accent-wash); }
  .lane li.done .t,.lane li.active .t{ color:var(--ink); }
  .lane li.done::before,.lane li.done::after,.lane li.active::before{ background:var(--accent); }
  .lane li.clickable{ cursor:pointer; }

  .work{ max-width:1080px; margin:0 auto; padding:18px clamp(16px,4vw,32px) 120px; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:26px; align-items:start; }
  @media(max-width:900px){ .work{ grid-template-columns:1fr; padding-bottom:150px; } }

  .step-head{ margin:6px 0 16px; }
  .kicker{ font-family:var(--mono); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--accent-d); margin:0 0 6px; }
  h1{ font-size:clamp(1.5rem,3.6vw,2rem); line-height:1.08; letter-spacing:-.02em; color:var(--ink); margin:0; font-weight:750; text-wrap:balance; }
  .step-head p{ margin:8px 0 0; color:var(--muted); max-width:52ch; font-size:.95rem; }
  .back{ background:none; border:0; color:var(--accent-d); font-family:var(--mono); font-size:.78rem; cursor:pointer; padding:4px 0; margin-bottom:2px; }
  .back:hover{ text-decoration:underline; }

  @media(prefers-reduced-motion:no-preference){ .panel-anim{ animation:rise .34s cubic-bezier(.22,.61,.36,1) both; } @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1;transform:none;} } }

  .svc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .svc{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; transition:border-color .18s, box-shadow .18s, transform .18s; display:flex; flex-direction:column; gap:10px; }
  .svc:hover{ border-color:var(--accent-line); box-shadow:var(--shadow); transform:translateY(-2px); }
  .svc.sel{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash); }
  .svc .ic{ width:38px; height:38px; border-radius:9px; background:var(--brand); color:#fff; display:grid; place-items:center; }
  .svc .nm{ font-weight:650; color:var(--ink); }
  .svc .ds{ font-size:.82rem; color:var(--muted); }
  .svc .meta{ display:flex; gap:10px; align-items:center; margin-top:2px; font-family:var(--mono); font-size:.78rem; color:var(--body); }
  .svc .price{ margin-left:auto; color:var(--ink); font-weight:600; }
  .chip{ display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:.68rem; letter-spacing:.04em; padding:2px 7px; border-radius:6px; background:var(--raise); border:1px solid var(--line); color:var(--muted); }

  .usual{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:linear-gradient(180deg,#fff, #fffdfa); border:1.5px solid var(--accent-line); border-radius:12px; padding:16px; cursor:pointer; transition:box-shadow .18s, transform .18s; }
  .usual:hover{ box-shadow:var(--shadow); transform:translateY(-1px); }
  .usual .star{ width:40px; height:40px; border-radius:10px; background:var(--accent-wash); color:var(--gold); display:grid; place-items:center; flex:none; }
  .usual .nm{ font-weight:700; color:var(--ink); }
  .usual .sub{ font-size:.82rem; color:var(--muted); }
  .usual .go{ margin-left:auto; font-family:var(--mono); font-size:.78rem; color:var(--accent-d); white-space:nowrap; }
  .or{ display:flex; align-items:center; gap:12px; color:var(--faint); font-family:var(--mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; margin:20px 0 12px; }
  .or::before,.or::after{ content:""; height:1px; background:var(--line); flex:1; }

  .deal{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .18s, box-shadow .18s, transform .18s; margin-bottom:10px; }
  .deal:hover:not(:disabled){ border-color:var(--accent-line); box-shadow:var(--shadow); transform:translateY(-1px); }
  .deal.sel{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash); }
  .deal:disabled{ cursor:not-allowed; opacity:.62; }
  .deal .dist{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:58px; flex:none; border-right:1px solid var(--line-2); padding-right:12px; }
  .deal .dist .km{ font-family:var(--mono); font-weight:700; color:var(--ink); font-size:1rem; }
  .deal .dist .u{ font-family:var(--mono); font-size:.64rem; color:var(--faint); letter-spacing:.1em; }
  .deal .main{ min-width:0; }
  .deal .nm{ font-weight:650; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .deal .row2{ font-size:.82rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:10px; margin-top:3px; }
  .deal .rate{ color:var(--gold); font-family:var(--mono); }
  .deal .avail{ margin-left:auto; text-align:right; flex:none; font-family:var(--mono); font-size:.76rem; color:var(--muted); }
  .deal .avail .big{ color:var(--avail); font-weight:700; display:block; }
  .deal .avail.none{ color:var(--full); }
  .tag-usual{ font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-d); background:var(--accent-wash); border:1px solid var(--accent-line); padding:1px 6px; border-radius:5px; }
  .skeleton{ color:var(--faint); font-family:var(--mono); font-size:.85rem; padding:10px 0; }

  .days{ display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
  .day{ flex:none; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 14px; cursor:pointer; text-align:center; font-family:var(--mono); transition:border-color .15s; }
  .day .dow{ font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .day .dnum{ font-size:1.05rem; font-weight:700; color:var(--ink); }
  .day.sel{ border-color:var(--accent); background:var(--accent-wash); }
  .slots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:9px; }
  .slot{ background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:10px 8px; cursor:pointer; text-align:center; transition:border-color .15s, box-shadow .15s; }
  .slot .tm{ font-family:var(--mono); font-weight:650; color:var(--ink); font-size:.92rem; }
  .slot .lft{ font-family:var(--mono); font-size:.66rem; color:var(--avail); margin-top:2px; }
  .slot:hover:not(:disabled){ border-color:var(--accent-line); }
  .slot.sel{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash); }
  .slot:disabled{ opacity:.45; cursor:not-allowed; }
  .slot:disabled .lft{ color:var(--full); }
  .slot.mine{ opacity:1; background:var(--accent-wash); border-color:var(--accent-line); cursor:not-allowed; }
  .slot.mine .tm{ color:var(--accent-d); }
  .slot.mine .lft{ color:var(--accent-d); }

  .vehpick{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .vehpick label{ font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .vehpick select{ width:auto; max-width:300px; padding:8px 12px; }
  .vehpick .ic{ width:30px; height:30px; border-radius:8px; background:var(--raise); color:var(--brand); display:grid; place-items:center; }
  .noslots{ color:var(--muted); font-size:.9rem; padding:20px 0; }

  .confirm-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; box-shadow:var(--shadow); }
  .cf-row{ display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line-2); }
  .cf-row:last-of-type{ border-bottom:0; }
  .cf-row .ic{ width:36px; height:36px; border-radius:9px; background:var(--raise); color:var(--brand); display:grid; place-items:center; flex:none; }
  .cf-row .lbl{ font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .cf-row .val{ font-weight:650; color:var(--ink); }
  .cf-row .edit{ margin-left:auto; background:none; border:0; color:var(--accent-d); font-family:var(--mono); font-size:.74rem; cursor:pointer; }
  .cf-row .edit:hover{ text-decoration:underline; }
  .veh{ margin-top:16px; }
  .veh label{ display:block; font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  select{ width:100%; font-family:var(--sans); font-size:.95rem; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px 12px; }

  .success{ text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:40px 28px; box-shadow:var(--shadow); }
  .success .tick{ width:64px; height:64px; border-radius:50%; background:var(--avail-wash); color:var(--avail); display:grid; place-items:center; margin:0 auto 16px; }
  .success h2{ margin:0 0 6px; color:var(--ink); font-size:1.4rem; }
  .success .code{ font-family:var(--mono); font-size:1.05rem; color:var(--accent-d); letter-spacing:.05em; margin:4px 0 18px; }
  .assigned{ display:inline-flex; gap:22px; background:var(--raise); border:1px solid var(--line); border-radius:12px; padding:14px 22px; margin-bottom:22px; flex-wrap:wrap; justify-content:center; }
  .assigned div{ text-align:left; } .assigned .lbl{ font-family:var(--mono); font-size:.64rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); } .assigned .v{ font-weight:650; color:var(--ink); }

  .rail{ position:sticky; top:88px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
  .rail h3{ margin:0; padding:15px 18px; font-family:var(--mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line-2); }
  .rail .items{ padding:6px 18px; }
  .ri{ display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-2); align-items:flex-start; }
  .ri:last-child{ border-bottom:0; }
  .ri .k{ font-family:var(--mono); font-size:.64rem; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); width:74px; flex:none; padding-top:2px; }
  .ri .v{ color:var(--ink); font-weight:600; font-size:.92rem; } .ri .v.empty{ color:var(--faint); font-weight:400; }
  .ri .v small{ display:block; font-weight:400; color:var(--muted); font-size:.8rem; }
  .rail .total{ display:flex; justify-content:space-between; align-items:baseline; padding:14px 18px; background:var(--raise); border-top:1px solid var(--line); }
  .rail .total .lbl{ font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .rail .total .amt{ font-family:var(--mono); font-size:1.3rem; font-weight:700; color:var(--ink); }
  .cta{ display:block; width:100%; border:0; background:var(--accent); color:#fff; font-family:var(--sans); font-weight:700; font-size:1rem; padding:15px; cursor:pointer; transition:background .15s; }
  .cta:hover:not(:disabled){ background:var(--accent-d); }
  .cta:disabled{ background:#D9DEE4; color:#fff; cursor:not-allowed; }

  .mbar{ display:none; }
  @media(max-width:900px){
    .rail{ display:none; }
    .mbar{ display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:12px clamp(16px,4vw,32px); align-items:center; gap:14px; }
    .mbar .amt{ font-family:var(--mono); font-weight:700; font-size:1.2rem; color:var(--ink); }
    .mbar .amt small{ display:block; font-family:var(--mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:400; }
    .mbar .cta{ margin-left:auto; width:auto; border-radius:10px; padding:14px 26px; }
  }

  button:focus-visible,select:focus-visible,[tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:.9rem; opacity:0; pointer-events:none; transition:all .3s; z-index:50; max-width:90vw; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media(max-width:900px){ .toast{ bottom:90px; } }

  .banner{ max-width:640px; margin:60px auto; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--full); border-radius:12px; padding:24px 26px; box-shadow:var(--shadow); }
  .banner h2{ margin:0 0 8px; color:var(--ink); font-size:1.1rem; }
  .banner code{ font-family:var(--mono); background:var(--raise); border:1px solid var(--line); border-radius:5px; padding:2px 7px; font-size:.85rem; color:var(--ink); }
</style>
</head>
<body>
<div class="topbar">
  <div class="in">
    <div class="logo">
      <span class="mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.3-.6-.6-2.3z"/></svg>
      </span>
      <span>Quick&nbsp;Book<small>Vehicle service</small></span>
    </div>
    <div class="acct" title="Signed-in account (demo)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <select id="user" aria-label="Account"></select>
    </div>
    <div class="home"><span class="lbl">Home</span> <span class="mono">12 Oak St</span></div>
  </div>
</div>

<nav class="lane" aria-label="Booking steps">
  <ol id="stepper">
    <li data-step="0"><span class="n">1</span><span class="t">Service</span></li>
    <li data-step="1"><span class="n">2</span><span class="t">Where</span></li>
    <li data-step="2"><span class="n">3</span><span class="t">When</span></li>
    <li data-step="3"><span class="n">4</span><span class="t">Confirm</span></li>
  </ol>
</nav>

<main class="work">
  <div id="stage"></div>
  <aside class="rail" id="rail"></aside>
</main>

<div class="mbar" id="mbar"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ REAL BACKEND CLIENT ============================ */
const API = '/api/v1';
async function api(path, opts){
  const r = await fetch(API + path, opts);
  const body = await r.json().catch(()=>null);
  if(!r.ok){ const e=new Error((body&&body.message)|| (body&&body.fieldErrors&&JSON.stringify(body.fieldErrors)) ||('HTTP '+r.status)); e.status=r.status; e.body=body; throw e; }
  return body;
}

/* home location — real haversine distance is computed to each dealership's coords */
const HOME = { lat:40.7300, lng:-73.9950 };
function haversine(lat, lng){
  const R=6371, toR=x=>x*Math.PI/180;
  const dLat=toR(lat-HOME.lat), dLng=toR(lng-HOME.lng);
  const a=Math.sin(dLat/2)**2 + Math.cos(toR(HOME.lat))*Math.cos(toR(lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

const ICONS = {
  OIL_CHANGE:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5 5.5 5 9a5 5 0 0 1-10 0c0-3.5 5-9 5-9z"/></svg>',
  BRAKE_SERVICE:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M19 9h2M3 15h2" stroke-linecap="round"/></svg>',
  DIAGNOSTIC:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>',
  EV_SERVICE:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13h6l-1 8 8-11h-6z"/></svg>',
  TIRE_ROTATION:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke-linecap="round"/></svg>',
  AC_SERVICE:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4 7l16 10M20 7 4 17M12 6l3-2M12 6 9 4M12 18l3 2M12 18l-3 2"/></svg>',
  _pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  _clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  _star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 5.9 21.4 7.3 14.6 2.2 9.9l6.9-.8z"/></svg>',
  _user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  _car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13v5h-2v-2H7v2H5z"/><circle cx="8" cy="15.5" r="1"/><circle cx="16" cy="15.5" r="1"/></svg>',
  _check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
};
const icon = code => ICONS[code] || ICONS._clock;
const DAYS = 4;

/* ============================ STATE + HELPERS ============================ */
let SERVICES=[], DEALERS=[], VEHICLES=[], CUSTOMERS=[];
const state = { step:0, max:0, service:null, dealer:null, day:0, slot:null, vehicle:0, userId:null, appt:null };
const earliestCache = {};   // key `${dealerId}:${serviceId}` -> {offered, day, start}

const $ = s => document.querySelector(s);
const el = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const money = n => '$'+n;
const pad = n => String(n).padStart(2,'0');
function fmt12(hhmm){ const [h,m]=hhmm.split(':').map(Number); const ap=h<12?'AM':'PM', h12=((h+11)%12)+1; return `${h12}:${pad(m)} ${ap}`; }
function dayDate(off){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+off); return d; }
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dayLabel(off){ if(off===0) return 'Today'; if(off===1) return 'Tomorrow'; return dayDate(off).toLocaleDateString(undefined,{weekday:'short'}); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }

function currentVehicleId(){ return VEHICLES[state.vehicle] ? VEHICLES[state.vehicle].id : null; }
async function fetchSlots(dealerId, serviceId, off){
  const vid = currentVehicleId();
  const vq = vid!=null ? `&vehicleId=${vid}` : '';
  return api(`/appointments/slots?dealershipId=${dealerId}&serviceTypeId=${serviceId}&date=${ymd(dayDate(off))}${vq}`);
}
function clearSlotCache(){ for(const k in earliestCache) delete earliestCache[k]; }
async function earliestFor(dealer, service){
  const key = `${dealer.id}:${service.id}:${currentVehicleId()}`;
  if(earliestCache[key]) return earliestCache[key];
  let result = { offered:true, day:null, start:null };
  for(let off=0; off<DAYS; off++){
    const day = await fetchSlots(dealer.id, service.id, off);
    if(!day.offered){ result={offered:false}; break; }
    const s = day.slots.find(x=>x.available && !x.mineBooked);   // ignore slots this vehicle already holds
    if(s){ result={offered:true, day:off, start:s.start}; break; }
  }
  earliestCache[key]=result; return result;
}

/* ============================ STEP RENDERERS ============================ */
function renderService(){
  const s = el(`<section class="panel-anim"><div class="step-head">
    <p class="kicker">Step 1 of 4</p><h1>What does your car need?</h1>
    <p>Start with the service — we’ll find shops that can do it and show the soonest openings.</p>
  </div><div class="svc-grid"></div></section>`);
  const grid = s.querySelector('.svc-grid');
  SERVICES.forEach(svc=>{
    const b = el(`<button class="svc ${state.service?.id===svc.id?'sel':''}" type="button">
      <span class="ic">${icon(svc.code)}</span>
      <span class="nm">${svc.name}</span>
      <span class="ds">${svc.description}</span>
      <span class="meta"><span class="chip">${svc.durationMinutes} min</span><span class="chip">${svc.requiredSkill}</span><span class="price">${money(svc.price)}</span></span>
    </button>`);
    b.onclick = ()=>{ state.service=svc; state.dealer=null; state.slot=null; go(1); };
    grid.appendChild(b);
  });
  return s;
}

function renderWhere(){
  const svc = state.service;
  const s = el(`<section class="panel-anim">
    <button class="back" type="button">← Change service</button>
    <div class="step-head"><p class="kicker">Step 2 of 4 · ${svc.name}</p>
      <h1>Where would you like it done?</h1>
      <p>Shops are ordered by distance from home. Your usual is one tap away.</p></div>
    <div id="whereBody"><p class="skeleton">Finding nearby shops with openings…</p></div>
  </section>`);
  s.querySelector('.back').onclick = ()=>go(0);
  fillWhere(s.querySelector('#whereBody'), svc);
  return s;
}
async function fillWhere(container, svc){
  const dealers = [...DEALERS].sort((a,b)=>a.distance-b.distance);
  const infos = await Promise.all(dealers.map(d=>earliestFor(d, svc)));
  const usual = dealers.find(d=>d.usual);
  const usualInfo = infos[dealers.indexOf(usual)];
  container.innerHTML='';

  if(usual){
    const availTxt = !usualInfo.offered ? 'doesn’t offer this service'
      : usualInfo.day!=null ? `earliest ${dayLabel(usualInfo.day)} ${fmt12(usualInfo.start)}` : 'no openings this week';
    const u = el(`<button class="usual" type="button">
      <span class="star">${ICONS._star}</span>
      <span><span class="nm">Use my usual — ${usual.name}</span>
        <span class="sub">${usual.distance.toFixed(1)} km · ★ ${usual.rating} · ${availTxt}</span></span>
      <span class="go">Select →</span></button>`);
    u.onclick = ()=>{ if(!usualInfo.offered){ toast(usual.name+' doesn’t offer '+svc.name); return; } pickDealer(usual, usualInfo); };
    container.appendChild(u);
    container.appendChild(el(`<div class="or">or choose another · sorted by distance</div>`));
  }

  dealers.forEach((d,i)=>{
    const info = infos[i];
    const availHtml = !info.offered
      ? `<span class="avail none">doesn’t offer<br>${svc.name}</span>`
      : info.day!=null
        ? `<span class="avail">earliest<br><span class="big">${dayLabel(info.day)} ${fmt12(info.start)}</span></span>`
        : `<span class="avail none">no openings<br>this week</span>`;
    const b = el(`<button class="deal ${state.dealer?.id===d.id?'sel':''}" type="button" ${info.offered?'':'disabled'}>
      <span class="dist"><span class="km">${d.distance.toFixed(1)}</span><span class="u">KM</span></span>
      <span class="main"><span class="nm">${d.name} ${d.usual?'<span class="tag-usual">Usual</span>':''}</span>
        <span class="row2"><span>${d.address}</span><span class="rate">★ ${d.rating}</span><span>Open ${d.openingTime.slice(0,5)}–${d.closingTime.slice(0,5)}</span></span></span>
      ${availHtml}</button>`);
    if(info.offered) b.onclick = ()=>pickDealer(d, info);
    container.appendChild(b);
  });
}
function pickDealer(d, info){
  state.dealer=d; state.slot=null;
  state.day = (info && info.day!=null) ? info.day : 0;
  go(2);
}

function renderWhen(){
  const { service:svc, dealer:d } = state;
  const s = el(`<section class="panel-anim">
    <button class="back" type="button">← Change location</button>
    <div class="step-head"><p class="kicker">Step 3 of 4 · ${d.name}</p>
      <h1>Pick a time</h1>
      <p>${svc.name} takes ${svc.durationMinutes} minutes. Times your car is already booked are marked and can’t be picked.</p></div>
    <div class="vehpick" id="vehpick"></div>
    <div class="days" id="days"></div>
    <div id="slotWrap"><p class="skeleton">Loading times…</p></div>
  </section>`);
  s.querySelector('.back').onclick = ()=>go(1);
  const vp = s.querySelector('#vehpick');
  if(!VEHICLES.length){
    vp.innerHTML = `<span class="ic">${ICONS._car}</span><span style="color:var(--muted);font-size:.9rem">No vehicles on this account.</span>`;
  } else {
    vp.innerHTML = `<span class="ic">${ICONS._car}</span><label>Booking for</label><select id="vehSel"></select>`;
    const vs = vp.querySelector('#vehSel');
    VEHICLES.forEach((v,i)=> vs.appendChild(el(`<option value="${i}" ${i===state.vehicle?'selected':''}>${v.make} ${v.model} · VIN …${v.vin.slice(-5)}</option>`)));
    vs.onchange=()=>{ state.vehicle=+vs.value; state.slot=null; refresh(); };   // re-fetch slots for the chosen car
  }
  const days = s.querySelector('#days');
  for(let off=0; off<DAYS; off++){
    const dd=dayDate(off);
    const b=el(`<button class="day ${state.day===off?'sel':''}" type="button"><span class="dow">${dayLabel(off)}</span><span class="dnum">${dd.getDate()}</span></button>`);
    b.onclick=()=>{ state.day=off; state.slot=null; refresh(); };
    days.appendChild(b);
  }
  fillSlots(s.querySelector('#slotWrap'), d, svc);
  return s;
}
async function fillSlots(wrap, d, svc){
  let day;
  try { day = await fetchSlots(d.id, svc.id, state.day); }
  catch(e){ wrap.innerHTML = `<p class="noslots">Couldn’t load times: ${e.message}</p>`; return; }
  const selectableCount = day.slots.filter(x=>x.available && !x.mineBooked).length;
  if(!selectableCount){ wrap.innerHTML = `<p class="noslots">No open times on ${dayLabel(state.day)} for this vehicle — try another day.</p>`; return; }
  wrap.innerHTML=''; const grid = el('<div class="slots"></div>');
  day.slots.forEach(sl=>{
    const selectable = sl.available && !sl.mineBooked;
    const left = Math.min(sl.bays, sl.technicians);
    const label = sl.mineBooked ? 'Booked' : (sl.available ? (left+' open') : 'full');
    const b=el(`<button class="slot ${state.slot===sl.start?'sel':''} ${sl.mineBooked?'mine':''}" type="button" ${selectable?'':'disabled'} ${sl.mineBooked?'title="Your car is already booked at this time"':''}>
      <span class="tm">${fmt12(sl.start)}</span>
      <span class="lft">${label}</span></button>`);
    if(selectable) b.onclick=()=>{ state.slot=sl.start; go(3); };
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
}

function renderConfirm(){
  const { service:svc, dealer:d } = state;
  const veh = VEHICLES[state.vehicle];
  const [h,m]=state.slot.split(':').map(Number);
  const endMin = h*60+m+svc.durationMinutes;
  const endStr = `${pad(Math.floor(endMin/60))}:${pad(endMin%60)}`;
  const s = el(`<section class="panel-anim">
    <button class="back" type="button">← Change time</button>
    <div class="step-head"><p class="kicker">Step 4 of 4</p><h1>Confirm your booking</h1>
      <p>Review the details, then confirm.</p></div>
    <div class="confirm-card">
      <div class="cf-row"><span class="ic">${icon(svc.code)}</span><span><span class="lbl">Service</span><br><span class="val">${svc.name} · ${svc.durationMinutes} min</span></span><button class="edit" data-go="0">Edit</button></div>
      <div class="cf-row"><span class="ic">${ICONS._pin}</span><span><span class="lbl">Location</span><br><span class="val">${d.name}</span> <span style="color:var(--muted);font-family:var(--mono);font-size:.82rem">${d.distance.toFixed(1)} km · ${d.address}</span></span><button class="edit" data-go="1">Edit</button></div>
      <div class="cf-row"><span class="ic">${ICONS._clock}</span><span><span class="lbl">Time</span><br><span class="val">${dayLabel(state.day)} ${dayDate(state.day).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${fmt12(state.slot)}–${fmt12(endStr)}</span></span><button class="edit" data-go="2">Edit</button></div>
      <div class="cf-row"><span class="ic">${ICONS._car}</span><span><span class="lbl">Vehicle</span><br><span class="val">${veh?`${veh.make} ${veh.model}`:'—'}</span> ${veh?`<span style="color:var(--muted);font-family:var(--mono);font-size:.82rem">VIN …${veh.vin.slice(-5)}</span>`:''}</span><button class="edit" data-go="2">Edit</button></div>
    </div>
  </section>`);
  s.querySelector('.back').onclick=()=>go(2);
  s.querySelectorAll('.edit').forEach(btn=> btn.onclick=()=>go(+btn.dataset.go));
  return s;
}

function renderSuccess(){
  const a = state.appt;
  const s = el(`<section class="panel-anim"><div class="success">
    <div class="tick">${ICONS._check}</div>
    <h2>You’re booked in</h2>
    <p style="color:var(--muted);margin:0 0 2px">${a.serviceType.name} at ${a.dealership.name}</p>
    <p class="code">Confirmation #${a.id} · ${a.status}</p>
    <div class="assigned">
      <div><div class="lbl">When</div><div class="v">${a.startTime.slice(0,10)} · ${fmt12(a.startTime.slice(11,16))}–${fmt12(a.endTime.slice(11,16))}</div></div>
      <div><div class="lbl">Technician</div><div class="v">${a.technician.name}</div></div>
      <div><div class="lbl">Service bay</div><div class="v">${a.serviceBay.name}</div></div>
      <div><div class="lbl">Vehicle</div><div class="v">${a.vehicle.make} ${a.vehicle.model}</div></div>
    </div>
    <div><button class="back" id="again" type="button">Book another service →</button></div>
  </div></section>`);
  s.querySelector('#again').onclick=()=>{ Object.assign(state,{step:0,max:0,service:null,dealer:null,day:0,slot:null,vehicle:0,appt:null}); render(); };
  return s;
}

/* ============================ SUMMARY RAIL + CHROME ============================ */
async function book(){
  const { service:svc, dealer:d } = state;
  const desiredStart = `${ymd(dayDate(state.day))}T${state.slot}:00`;
  const payload = { dealershipId:d.id, vehicleId:VEHICLES[state.vehicle].id, serviceTypeId:svc.id, desiredStart };
  const rc=$('#railCta'), mc=$('#mCta');
  [rc,mc].forEach(b=>{ if(b){ b.disabled=true; b.textContent='Booking…'; }});
  try{
    state.appt = await api('/appointments', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    clearSlotCache();   // availability changed (this vehicle now has a booking)
    go(4);
  }catch(e){
    [rc,mc].forEach(b=>{ if(b){ b.disabled=false; b.textContent='Confirm booking'; }});
    if(e.status===409){ toast('That slot was just taken — pick another time.'); go(2); }
    else toast('Couldn’t book: '+e.message);
  }
}
function railHtml(){
  const svc=state.service, d=state.dealer;
  const row=(k,v,empty)=>`<div class="ri"><span class="k">${k}</span><span class="v ${empty?'empty':''}">${v}</span></div>`;
  const timeVal = state.slot!=null ? `${dayLabel(state.day)} ${fmt12(state.slot)}<small>${dayDate(state.day).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small>` : '—';
  const canConfirm = svc && d && state.slot!=null && state.step===3 && VEHICLES.length>0;
  return `<h3>Your booking</h3><div class="items">
    ${row('Service', svc?`${svc.name}<small>${svc.durationMinutes} min</small>`:'Not chosen', !svc)}
    ${row('Where', d?`${d.name}<small>${d.distance.toFixed(1)} km away</small>`:'Not chosen', !d)}
    ${row('When', timeVal, state.slot==null)}
    ${row('Vehicle', VEHICLES.length?`${VEHICLES[state.vehicle].make} ${VEHICLES[state.vehicle].model}`:'—', !VEHICLES.length)}
  </div>
  <div class="total"><span class="lbl">Estimated</span><span class="amt">${money(svc?svc.price:0)}</span></div>
  <button class="cta" id="railCta" ${canConfirm?'':'disabled'}>${state.step<3?'Keep going':'Confirm booking'}</button>`;
}
function renderRail(){
  $('#rail').innerHTML = railHtml();
  const svc=state.service, d=state.dealer;
  $('#mbar').innerHTML = `<div class="amt">${money(svc?svc.price:0)}<small>${svc?svc.name:'Choose a service'}</small></div>
    <button class="cta" id="mCta" ${svc&&d&&state.slot!=null&&state.step===3&&VEHICLES.length?'':'disabled'}>Confirm booking</button>`;
  const rc=$('#railCta'); if(rc && state.step===3) rc.onclick=book;
  const mc=$('#mCta'); if(mc && state.step===3) mc.onclick=book;
}
function renderStepper(){
  document.querySelectorAll('#stepper li').forEach(li=>{
    const n=+li.dataset.step;
    li.classList.toggle('done', n<state.step && state.step<4);
    li.classList.toggle('active', n===state.step && state.step<4);
    const can = n<=state.max && state.step<4;
    li.classList.toggle('clickable', can);
    li.onclick = can ? ()=>go(n) : null;
  });
}

/* ============================ ROUTER ============================ */
const STEPS = [renderService, renderWhere, renderWhen, renderConfirm, renderSuccess];
function render(){ const stage=$('#stage'); stage.innerHTML=''; stage.appendChild(STEPS[state.step]()); renderStepper(); renderRail(); window.scrollTo({top:0,behavior:'smooth'}); }
function refresh(){ const stage=$('#stage'); stage.innerHTML=''; stage.appendChild(STEPS[state.step]()); renderStepper(); renderRail(); }
function go(step){
  if(step>0 && !state.service) step=0;
  if(step>1 && !state.dealer) step=Math.min(step,1);
  if(step>2 && state.slot==null) step=Math.min(step,2);
  state.step=step; state.max=Math.max(state.max, Math.min(step,3));
  render();
}

async function loadVehicles(customerId){
  VEHICLES = await api('/vehicles?customerId='+customerId);
  state.vehicle = 0;
}
function fillUserPicker(){
  const sel = $('#user');
  sel.innerHTML = CUSTOMERS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  sel.value = state.userId;
  sel.onchange = async ()=>{
    state.userId = +sel.value;
    await loadVehicles(state.userId);
    toast('Signed in as '+CUSTOMERS.find(c=>c.id===state.userId).name);
    render();   // refresh so the vehicle picker + summary reflect this account
  };
}
async function boot(){
  try{
    const [custs, svcs, deals] = await Promise.all([
      api('/customers'), api('/service-types'), api('/dealerships')
    ]);
    CUSTOMERS = custs;
    SERVICES = svcs;
    DEALERS = deals.map(d=>({ ...d, distance: haversine(d.latitude, d.longitude) }));
    state.userId = custs[0].id;
    fillUserPicker();
    await loadVehicles(state.userId);
    render();
  }catch(e){
    $('#stage').closest('.work').style.gridTemplateColumns='1fr';
    $('#rail').style.display='none';
    $('#stage').innerHTML = `<div class="banner"><h2>Can’t reach the service API</h2>
      <p>This page talks to the live backend. Start it and open this page from the server:</p>
      <p><code>./mvnw spring-boot:run</code> → then visit <code>http://localhost:8080/</code></p>
      <p style="color:var(--muted);font-size:.85rem;margin-top:12px">(${e.message})</p></div>`;
  }
}
boot();
</script>
</body>
</html>
