# Production-style profile: activate with -Dspring.profiles.active=postgres
# Provide credentials via environment variables (never commit secrets).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USERNAME:scheduler}
    password: ${DB_PASSWORD:scheduler}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
